services:
  - type: web
    name: emberfall-coop
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: ACCOUNT_DATA_URL
        value: https://emberfall-ruinas.joaovsvieira-me.chatgpt.site/internal/data
      - key: DATA_SERVICE_KEY
        sync: false
